schema: agent-workflow-protocol
version: "0.1"
id: simple-llm
name: Simple LLM

inputs:
  question:
    type: string
    required: true

outputs:
  answer:
    type: string
    required: true

agents:
  answer:
    role: assistant
    model:
      provider: openai
      name: gpt-4o-mini
      temperature: 0.2
      max_output_tokens: 256
    instructions: Answer the user's question concisely.

graph:
  start: answer
  nodes:
    answer:
      type: agent
      ref: answer
    done:
      type: end
  edges:
    - from: answer
      to: done

adapters:
  schift:
    target: workflow_v2
    status: direct
    runtime: schift
  vercel_ai_sdk:
    target: generateText
    status: direct
  google_genai:
    target: models.generateContent
    status: direct
  langgraph_js:
    target: StateGraph
    status: direct
